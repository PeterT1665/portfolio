    <meta name="theme-color" content="#dbe7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1a33" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong colours.
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
